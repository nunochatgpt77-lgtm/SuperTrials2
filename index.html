      function lerCacheApps() {
        try {
          var raw = localStorage.getItem(CACHE_KEY);
          if (!raw) return appsPadrao.slice();
          var parsed = JSON.parse(raw);
          return Array.isArray(parsed) && parsed.length > 0 ? parsed : appsPadrao.slice();
        } catch (e) {
          return appsPadrao.slice();
        }
      }

      function lerSubscricoes() {
        try {
          var raw = localStorage.getItem(SUBS_KEY);
          if (raw === null) return subsIniciais.slice();
          var parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : subsIniciais.slice();
        } catch (e) {
          return subsIniciais.slice();
        }

      function getHojeLocalISO() {
        var n = new Date();
        var y = n.getFullYear();
        var m = String(n.getMonth() + 1).padStart(2, "0");
        var d = String(n.getDate()).padStart(2, "0");
        return y + "-" + m + "-" + d;
      }

      function adicionarDiasISO(baseISO, dias) {
        if (!baseISO || !dias) return baseISO;
        var dt = new Date(baseISO + "T12:00:00");
        if (isNaN(dt.getTime())) return baseISO;
        dt.setDate(dt.getDate() + dias);
        var y = dt.getFullYear();
        var m = String(dt.getMonth() + 1).padStart(2, "0");
        var d = String(dt.getDate()).padStart(2, "0");
        return y + "-" + m + "-" + d;
      }

      function diasRestantes(dataFim) {
        var partes = String(dataFim || "").split("-");
        if (partes.length !== 3) return 999;
        var y = parseInt(partes[0], 10);
        var m = parseInt(partes[1], 10) - 1;
        var d = parseInt(partes[2], 10);
        var hoje = new Date();
        hoje.setHours(0, 0, 0, 0);
        var fim = new Date(y, m, d);
        fim.setHours(0, 0, 0, 0);
        return Math.round((fim.getTime() - hoje.getTime()) / 86400000);
      }

      function formatarDataPT(iso) {
        if (!iso) return "--/--/----";
        var partes = String(iso).split("-");
        if (partes.length !== 3) return iso;
        return partes[2] + "/" + partes[1] + "/" + partes[0];
      }

      function criarLogoWrap(nome, dominio) {

        wrap.className = "logo-wrap";

        var img = document.createElement("img");
        img.alt = nome || "";
        img.src = "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(dominio || "google.com") + "&sz=128";

          wrap.innerHTML = "";
          var fallback = document.createElement("span");
          fallback.className = "logo-fallback";
          fallback.textContent = (nome || "?").charAt(0).toUpperCase();
          wrap.appendChild(fallback);

        wrap.appendChild(img);

      var elAlertaBanner = document.getElementById("alerta-banner");
      var elAlertaSucesso = document.getElementById("alerta-sucesso");
      var elAlertaSucessoTexto = document.getElementById("alerta-sucesso-texto");
      var elAlertaSucessoFechar = document.getElementById("alerta-sucesso-fechar");
      var elNavOfertas = document.getElementById("nav-ofertas");
      var elNavSubs = document.getElementById("nav-subs");
      var elSecaoOfertas = document.getElementById("secao-ofertas");
      var elSecaoSubs = document.getElementById("secao-subs");
      var elMenuTabs = document.getElementById("menu-tabs");
      var elListaApps = document.getElementById("lista-apps");
      var elFormSub = document.getElementById("form-sub");
      var elSubServico = document.getElementById("sub-servico");
      var elBoxOutro = document.getElementById("box-outro");
      var elSubNomeCustom = document.getElementById("sub-nome-custom");
      var elSubDomCustom = document.getElementById("sub-dom-custom");
      var elSubInicio = document.getElementById("sub-inicio");
      var elSubDias = document.getElementById("sub-dias");
      var elSubFim = document.getElementById("sub-fim");
      var elSubAviso = document.getElementById("sub-aviso");
      var elBtnGuardar = document.getElementById("btn-guardar-sub");
      var elStatusMsg = document.getElementById("status-msg");
      var elListaSubs = document.getElementById("lista-subs");

      var hojeStr = getHojeLocalISO();
      elSubInicio.value = hojeStr;
      elSubFim.value = adicionarDiasISO(hojeStr, parseInt(elSubDias.value, 10));

      function extrairDiasDuracao(texto) {
        var str = String(texto || "").toLowerCase();
        var matchMes = str.match(/(\d+)\s*m[eê]s/);
        if (matchMes) {
          return Math.max(1, parseInt(matchMes[1], 10) * 30);
        }
        var matchesDias = str.match(/(\d+)\s*dias?/g);
        if (matchesDias && matchesDias.length > 0) {
          var ultimo = matchesDias[matchesDias.length - 1].match(/\d+/);
          if (ultimo) return Math.max(1, parseInt(ultimo[0], 10));
        }
        var matchRange = str.match(/\d+\s*a\s*(\d+)/);
        if (matchRange) {
          return Math.max(1, parseInt(matchRange[1], 10));
        }
        return 30;
      }

      function mostrarAlertaSucesso(mensagem) {
        if (sucessoBannerTimer !== null) {
          clearTimeout(sucessoBannerTimer);
          sucessoBannerTimer = null;
        }
        elAlertaSucessoTexto.textContent = mensagem;
        elAlertaSucesso.classList.add("visivel");

        sucessoBannerTimer = setTimeout(function () {
          elAlertaSucesso.classList.remove("visivel");
          elAlertaSucessoTexto.textContent = "";
          sucessoBannerTimer = null;
        }, 5000);
      }

      function mostrarStatus(mensagem, tipo) {
        if (statusTimer !== null) {
          clearTimeout(statusTimer);
          statusTimer = null;
        }
        elStatusMsg.textContent = mensagem;
        elStatusMsg.className = "status-msg " + (tipo === "error" ? "error" : "success");
        elStatusMsg.setAttribute("role", tipo === "error" ? "alert" : "status");

        statusTimer = setTimeout(function () {
          elStatusMsg.className = "status-msg hidden";
          elStatusMsg.textContent = "";
          statusTimer = null;
        }, 5000);
      }

      function mudarSecao(secao) {
        var emOfertas = secao === "ofertas";
        elSecaoOfertas.classList.toggle("hidden", !emOfertas);
        elSecaoSubs.classList.toggle("hidden", emOfertas);
        elNavOfertas.classList.toggle("active", emOfertas);
        elNavSubs.classList.toggle("active", !emOfertas);
        if (!emOfertas) {
          desenharSubscricoes();
        }
      }

      function calcularFimAutomatico() {
        var inicio = elSubInicio.value;
        var dias = parseInt(elSubDias.value, 10);
        if (!inicio || dias === 0) return;
        elSubFim.value = adicionarDiasISO(inicio, dias);
      }

      function verificarAlertas() {
        elNavSubs.textContent = "⏰ Subscrições (" + minhasSubs.length + ")";

        var urgentes = minhasSubs.filter(function (s) {
          return diasRestantes(s.fim) <= (s.aviso || 2);
        });

        if (urgentes.length > 0) {
          elAlertaBanner.innerHTML = "";
          var prefixo = document.createTextNode("⚠️ ");
          var strong = document.createElement("strong");
          strong.textContent = "Alerta de Expiração:";
          var resumo = urgentes.map(function (u) {
            var d = diasRestantes(u.fim);
            if (d < 0) return u.nome + " (expirou)";
            if (d === 0) return u.nome + " (acaba HOJE!)";
            return u.nome + " (faltam " + d + "d)";
          }).join(" • ");
          elAlertaBanner.appendChild(prefixo);
          elAlertaBanner.appendChild(strong);
          elAlertaBanner.appendChild(document.createTextNode(" " + resumo));
          elAlertaBanner.style.display = "block";
        } else {
          elAlertaBanner.style.display = "none";
          elAlertaBanner.textContent = "";
        }
      }

      function desenharSubscricoes() {
        elListaSubs.innerHTML = "";

        var ordenadas = minhasSubs.slice().sort(function (a, b) {
          return String(a.fim || "").localeCompare(String(b.fim || ""));
        });

        ordenadas.forEach(function (sub) {
          var falta = diasRestantes(sub.fim);
          var classeItem = "";
          var classeTexto = "";
          var textoFalta = "Faltam " + falta + " dias";

          if (falta < 0) {
            classeItem = "urgente";
            classeTexto = "vermelho";
            textoFalta = "Expirou há " + Math.abs(falta) + " dia(s)";
          } else if (falta === 0) {
            classeItem = "urgente";
            classeTexto = "vermelho";
            textoFalta = "ACABA HOJE — Cancelar já!";
          } else if (falta <= (sub.aviso || 2)) {
            classeItem = "urgente";
            classeTexto = "vermelho";
            textoFalta = "ALERTA: Faltam " + falta + " dia(s)!";
          } else if (falta <= 7) {
            classeItem = "aviso";
            classeTexto = "amarelo";
          }

          var item = document.createElement("div");
          item.className = "item " + classeItem;

          var esq = document.createElement("div");
          esq.className = "esq";
          esq.appendChild(criarLogoWrap(sub.nome, sub.dominio));

          var info = document.createElement("div");
          info.className = "info";

          var elNome = document.createElement("div");
          elNome.className = "nome";
          elNome.textContent = sub.nome;

          var elDuracao = document.createElement("div");
          elDuracao.className = "duracao " + classeTexto;
          elDuracao.textContent = textoFalta;

          var elNota = document.createElement("div");
          elNota.className = "nota";
          elNota.textContent = "Adesão: " + formatarDataPT(sub.inicio) + " • Fim: " + formatarDataPT(sub.fim);

          info.appendChild(elNome);
          info.appendChild(elDuracao);
          info.appendChild(elNota);
          esq.appendChild(info);

          var btnDel = document.createElement("button");
          btnDel.type = "button";
          btnDel.className = "btn-del";
          btnDel.textContent = "Apagar";
          btnDel.addEventListener("click", function () {
            removerSub(sub.id);
          });

          item.appendChild(esq);
          item.appendChild(btnDel);
          elListaSubs.appendChild(item);
        });
      }

      function removerSub(id) {
        try {
          minhasSubs = minhasSubs.filter(function (s) {
            return s.id !== id;
          });
          localStorage.setItem(SUBS_KEY, JSON.stringify(minhasSubs));
          desenharSubscricoes();
          verificarAlertas();
        } catch (err) {
          mostrarStatus("Erro ao apagar subscrição: " + (err && err.message ? err.message : err), "error");
        }
      }

      function adicionarSubscricao(e) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }

        var agora = Date.now();
        if (isSaving || agora - lastSaveTs < 350) {
          return;
        }
        isSaving = true;
        lastSaveTs = agora;

        try {
          var sel = elSubServico.value;
          var nome = "";
          var dominio = "";

          if (sel.indexOf("outro|") === 0) {
            nome = elSubNomeCustom.value.trim();
            dominio = elSubDomCustom.value.trim() || "google.com";
            if (!nome) {
              mostrarStatus("Preenche o nome do serviço antes de guardar.", "error");
              return;
            }
          } else {
            var partes = sel.split("|");
            nome = (partes[0] || "").trim();
            dominio = (partes[1] || "").trim() || "google.com";
          }

          var inicio = elSubInicio.value || getHojeLocalISO();
          var duracao = parseInt(elSubDias.value, 10) || 0;
          var fim = elSubFim.value || (duracao > 0 ? adicionarDiasISO(inicio, duracao) : "");
          var aviso = parseInt(elSubAviso.value, 10) || 2;

          elSubInicio.value = inicio;
          if (fim) elSubFim.value = fim;

          if (!fim) {
            mostrarStatus("Seleciona a data de fim / cancelar até.", "error");
            return;
          }

          var novaSub = {
            id: agora,
            nome: nome,
            dominio: dominio,
            inicio: inicio,
            duracao: duracao,
            fim: fim,
            aviso: aviso
          };

          var novaLista = minhasSubs.concat([novaSub]);
          try {
            localStorage.setItem(SUBS_KEY, JSON.stringify(novaLista));
          } catch (storageErr) {}
          minhasSubs = novaLista;

          elSubNomeCustom.value = "";
          elSubDomCustom.value = "";

          desenharSubscricoes();
          verificarAlertas();
          mostrarStatus("✅ Sucesso! Subscrição guardada e alerta ativado na aplicação!", "success");
          mostrarAlertaSucesso("✅ Sucesso! Subscrição de \"" + nome + "\" guardada e alerta ativado (" + aviso + "d antes).");
        } catch (err) {
          var msg = err && err.message ? err.message : "Erro ao guardar subscrição.";
          mostrarStatus("Erro ao guardar: " + msg, "error");
        } finally {
          isSaving = false;
        }
      }

      function subscreverServico(app) {
        var agora = Date.now();
        if (isSaving || agora - lastSaveTs < 350) {
          return;
        }
        isSaving = true;
        lastSaveTs = agora;

        try {
          var inicio = getHojeLocalISO();
          var duracao = extrairDiasDuracao(app.duracao);
          var fim = adicionarDiasISO(inicio, duracao);

          var novaSub = {
            id: agora,
            nome: app.nome,
            dominio: app.dominio || "google.com",
            inicio: inicio,
            duracao: duracao,
            fim: fim,
            aviso: 2
          };

          var novaLista = minhasSubs.concat([novaSub]);
          try {
            localStorage.setItem(SUBS_KEY, JSON.stringify(novaLista));
          } catch (storageErr) {}
          minhasSubs = novaLista;

          desenharSubscricoes();
          verificarAlertas();
          mostrarStatus("✅ Sucesso! Subscrição guardada e alerta ativado na aplicação!", "success");
          mostrarAlertaSucesso("✅ Sucesso! Serviço \"" + app.nome + "\" subscrito e alerta ativado (fim em " + formatarDataPT(fim) + ").");
        } catch (err) {
          var msg = err && err.message ? err.message : "Erro ao subscrever serviço.";
          mostrarStatus("Erro ao subscrever: " + msg, "error");
        } finally {
          isSaving = false;
        }
      }

      function desenharLista(cat) {
        filtroAtual = cat;
        elListaApps.innerHTML = "";

        var itens = cat === "todos"
          ? dadosAtuais
          : dadosAtuais.filter(function (a) { return a.categoria === cat; });

        itens.forEach(function (app) {
          var el = document.createElement("div");
          el.className = "item " + (app.categoria || "");

          var esq = document.createElement("div");
          esq.className = "esq";
          esq.appendChild(criarLogoWrap(app.nome, app.dominio));

          var info = document.createElement("div");
          info.className = "info";

          var nomeLinha = document.createElement("div");
          nomeLinha.className = "nome-linha";

          var spanNome = document.createElement("span");
          spanNome.className = "nome";
          spanNome.textContent = app.nome;
          nomeLinha.appendChild(spanNome);

          if (app.novo) {
            var spanNovo = document.createElement("span");
            spanNovo.className = "novo-tag";
            spanNovo.textContent = "NOVO";
            nomeLinha.appendChild(spanNovo);
          }

          var elDuracao = document.createElement("div");
          elDuracao.className = "duracao";
          elDuracao.textContent = app.duracao;

          var elNota = document.createElement("div");
          elNota.className = "nota";
          elNota.textContent = app.detalhe;

          info.appendChild(nomeLinha);
          info.appendChild(elDuracao);
          info.appendChild(elNota);
          esq.appendChild(info);

          var acoes = document.createElement("div");
          acoes.className = "card-actions";

          var btnSub = document.createElement("button");
          btnSub.type = "button";
          btnSub.className = "btn-subscrever";
          btnSub.textContent = "Subscrever";
          btnSub.addEventListener("click", function () {
            subscreverServico(app);
          });

          var link = document.createElement("a");
          link.className = "btn-acao";
          link.href = app.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "Registar";

          acoes.appendChild(btnSub);
          acoes.appendChild(link);

          el.appendChild(esq);
          el.appendChild(acoes);
          elListaApps.appendChild(el);
        });
      }

      async function carregarTrials(manual) {
        elBtnAtualizar.disabled = true;
        if (manual) {
          elEstado.textContent = "A atualizar...";
        }

        try {
          var res = await fetch(GIST_URL + "?t=" + Date.now());
          if (!res.ok) throw new Error("Erro HTTP");
          var json = await res.json();
          if (Array.isArray(json) && json.length > 0) {
            dadosAtuais = json;
            try {
              localStorage.setItem(CACHE_KEY, JSON.stringify(json));
            } catch (e) {}
            desenharLista(filtroAtual);
            elNavOfertas.textContent = "🎯 Ofertas (" + dadosAtuais.length + ")";
            elEstado.textContent = dadosAtuais.length + " trials disponíveis • Online";
            if (manual) {
              mostrarAlertaSucesso("✅ Sucesso! Ofertas atualizadas (" + dadosAtuais.length + " trials disponíveis).");
            }
            return;
          }
          throw new Error("Dados inválidos");
        } catch (e) {
          dadosAtuais = lerCacheApps();
          desenharLista(filtroAtual);
          elNavOfertas.textContent = "🎯 Ofertas (" + dadosAtuais.length + ")";
          elEstado.textContent = dadosAtuais.length + " trials disponíveis • Modo Local";
          if (manual) {
            mostrarAlertaSucesso("✅ Sucesso! Lista atualizada em modo local (" + dadosAtuais.length + " trials disponíveis).");
          }
        } finally {
          elBtnAtualizar.disabled = false;
        }
      }

      // Eventos
      elBtnAtualizar.addEventListener("click", function () {
        carregarTrials(true);
      });

      elNavOfertas.addEventListener("click", function () {
        mudarSecao("ofertas");
      });

      elNavSubs.addEventListener("click", function () {
        mudarSecao("subs");
      });

      elMenuTabs.addEventListener("click", function (e) {
        var btn = e.target.closest(".tab");
        if (!btn) return;
        var cat = btn.getAttribute("data-cat") || "todos";
        var tabs = elMenuTabs.querySelectorAll(".tab");
        for (var i = 0; i < tabs.length; i++) {
          tabs[i].classList.remove("active");
        }
        btn.classList.add("active");
        desenharLista(cat);
      });

      elSubServico.addEventListener("change", function () {
        var isOutro = elSubServico.value.indexOf("outro|") === 0;
        elBoxOutro.classList.toggle("hidden", !isOutro);
      });

      elSubInicio.addEventListener("change", calcularFimAutomatico);
      elSubDias.addEventListener("change", calcularFimAutomatico);

      elFormSub.addEventListener("submit", function (e) {
        e.preventDefault();
        e.stopPropagation();
      });

      elBtnGuardar.addEventListener("click", adicionarSubscricao);

      elAlertaSucessoFechar.addEventListener("click", function () {
        if (sucessoBannerTimer !== null) {
          clearTimeout(sucessoBannerTimer);
          sucessoBannerTimer = null;
        }
        elAlertaSucesso.classList.remove("visivel");
        elAlertaSucessoTexto.textContent = "";
      });

      // Arranque inicial
      desenharLista("todos");
      desenharSubscricoes();
      verificarAlertas();
      carregarTrials(false);
    })();
  </script>
</body>
</html>
